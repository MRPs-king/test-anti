<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="game-container">
        <header class="header">
            <h1>Tic <span class="accent">Tac</span> Toe</h1>
            <p class="subtitle">Three in a row wins</p>
        </header>

        <div class="scoreboard">
            <div class="score-card" id="scoreX">
                <span class="score-label">Player X</span>
                <span class="score-value">0</span>
            </div>
            <div class="score-card draws">
                <span class="score-label">Draws</span>
                <span class="score-value" id="drawCount">0</span>
            </div>
            <div class="score-card" id="scoreO">
                <span class="score-label">Player O</span>
                <span class="score-value">0</span>
            </div>
        </div>

        <div class="status" id="status">Player X's turn</div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="restartBtn">Restart Game</button>
            <button class="btn btn-ghost" id="resetScoreBtn">Reset Scores</button>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
